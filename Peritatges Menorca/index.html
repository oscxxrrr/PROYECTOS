<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="Aplicación profesional para peritos de vehículos. Ráfagas rápidas de fotos, detección automática de matrícula y compresión de almacenamiento." />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Peritatges Menorca" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <title>PERITATGES MENORCA | Peritaje de Vehículos</title>
    <style>
      @keyframes pm-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen select-none touch-manipulation">
    <!-- Contenedor principal con indicador de carga inicial corporativo para evitar parpadeos en blanco -->
    <div id="root">
      <div style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#f8fafc;font-family:'Inter',system-ui,-apple-system,sans-serif;text-align:center;padding:24px;">
        <div style="max-width:320px;width:100%;">
          <div style="width:54px;height:54px;border:4px solid rgba(2,132,199,0.25);border-top-color:#38bdf8;border-radius:50%;animation:pm-spin 0.8s linear infinite;margin:0 auto 20px;"></div>
          <h1 style="font-size:22px;font-weight:800;letter-spacing:-0.5px;margin:0 0 6px;color:#ffffff;">PERITATGES <span style="color:#38bdf8;">MENORCA</span></h1>
          <p style="font-size:13px;color:#94a3b8;margin:0 0 16px;">Iniciando sistema de peritaje...</p>
          <div style="height:3px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;">
            <div style="width:50%;height:100%;background:#38bdf8;border-radius:3px;animation:pm-spin 1.5s ease-in-out infinite;"></div>
          </div>
        </div>
      </div>
    </div>
    
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Registro seguro del Service Worker
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.log('SW no registrado (modo estándar activo):', err);
          });
        });
      }
    </script>
  </body>
</html>
